var dp=sec("Por departamento");var tabs=el("div","tabs");tabs.setAttribute("role","tablist");var body=el("div");var keys=Object.keys(NAMES);

c.appendChild(el("h3",null,"Mejoras"));c.appendChild(list(d.mejoras));var nx=(D.proximas||[]).filter(function(x){return x.dept.toLowerCase().indexOf(NAMES[key].toLowerCase().slice(0,4))===0});if(nx.length){c.appendChild(el("h3",null,"Siguiente tarea"));nx.forEach(function(x){c.appendChild(el("p",null,x.tarea+" · empieza "+x.cuando+" · termina "+x.fin))})}body.appendChild(c);try{history.replaceState(null,"","#"+key)}catch(e){}}

var start=(location.hash||"").slice(1);show(keys.indexOf(start)>-1?start:"web");
