<style>
/* Distribución: cabecera con estado, bloque "Tu parte hoy", línea del día y pestañas por departamento. */
:root{--bg:#f4f6fb;--card:#fff;--ink:#0d1636;--mut:#5b6685;--line:#dfe4f0;--accent:#0a6cff;--ok:#12805c;--warn:#b86e00;--bad:#c0262d;--okbg:#e3f5ee;--warnbg:#fff1dc;--badbg:#fde6e7;--chip:#eaf0ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060a1f;--card:#0e1534;--ink:#eaf0ff;--mut:#9aa7cf;--line:#222c57;--accent:#4da3ff;--ok:#4fd1a1;--warn:#ffbe55;--bad:#ff7a80;--okbg:#0f3a2d;--warnbg:#3b2a0a;--badbg:#4a1519;--chip:#18224a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#060a1f;--card:#0e1534;--ink:#eaf0ff;--mut:#9aa7cf;--line:#222c57;--accent:#4da3ff;--ok:#4fd1a1;--warn:#ffbe55;--bad:#ff7a80;--okbg:#0f3a2d;--warnbg:#3b2a0a;--badbg:#4a1519;--chip:#18224a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
.wrap{max-width:1000px;margin:0 auto;display:grid;gap:18px}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;margin:0;text-wrap:balance}
h1{font-size:26px}h2{font-size:18px}h3{font-size:15px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.sub{color:var(--mut);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-weight:600;font-size:13px}
.ok{background:var(--okbg);color:var(--ok)}.warn{background:var(--warnbg);color:var(--warn)}.bad{background:var(--badbg);color:var(--bad)}.neutral{background:var(--chip);color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.kpi{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.kpi span{color:var(--mut);font-size:12px}.kpi i{font-style:normal;font-size:12px;font-weight:600}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer;min-height:40px}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs button:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;font:inherit;font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:10px;padding:7px 12px;cursor:pointer;text-decoration:none;min-height:36px}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:0}
.tl li{display:grid;grid-template-columns:56px 14px 1fr;gap:10px;padding:8px 0;align-items:start}
.tl time{font-variant-numeric:tabular-nums;font-weight:600;color:var(--mut)}
.dot{width:12px;height:12px;border-radius:50%;margin-top:5px;background:var(--line)}
.dot.hecho{background:var(--ok)}.dot.curso{background:var(--accent)}.dot.manual{background:var(--warn)}
.tl small{display:block;color:var(--mut)}
ul.plain{margin:0;padding-left:18px;display:grid;gap:4px}
.cap{white-space:pre-wrap;background:var(--chip);border-radius:10px;padding:10px;font-size:13px;margin:8px 0;max-height:150px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.empty{color:var(--mut);font-style:italic}
a{color:var(--accent)}
</style>

<script>

var dp=sec("Por departamento");var tabs=el("div","tabs");tabs.setAttribute("role","tablist");var body=el("div");var keys=Object.keys(NAMES);

c.appendChild(el("h3",null,"Mejoras"));c.appendChild(list(d.mejoras));var nx=(D.proximas||[]).filter(function(x){return x.dept.toLowerCase().indexOf(NAMES[key].toLowerCase().slice(0,4))===0});if(nx.length){c.appendChild(el("h3",null,"Siguiente tarea"));nx.forEach(function(x){c.appendChild(el("p",null,x.tarea+" · empieza "+x.cuando+" · termina "+x.fin))})}body.appendChild(c);try{history.replaceState(null,"","#"+key)}catch(e){}}
keys.forEach(function(key){var b=el("button",null,NAMES[key]);b.type="button";b.id="tab-"+key;b.setAttribute("role","tab");b.onclick=function(){show(key)};tabs.appendChild(b)});dp.appendChild(tabs);dp.appendChild(body);app.appendChild(dp);
var start=(location.hash||"").slice(1);show(keys.indexOf(start)>-1?start:"web");

if(D.historial&&D.historial.length){var h=sec("Últimos días");var u3=el("ul","plain");D.historial.forEach(function(x){u3.appendChild(el("li",null,x.fecha+" · "+x.estado+" · "+x.resumen))});h.appendChild(u3);app.appendChild(h)}
})();
